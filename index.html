<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ponto Eletrônico - Residentes HOVET / UFMT</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f8fafc;
    }
  </style>
</head>
<body class="min-h-screen text-slate-800 flex flex-col justify-between antialiased">

  <!-- CABEÇALHO -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <div class="bg-blue-600 text-white p-2 rounded-lg font-bold">
          <i class="fa-solid me-1 fa-hospital flex-shrink-0"></i>
        </div>
        <div>
          <h1 class="font-bold text-slate-900 text-base leading-tight">HOVET / UFMT</h1>
          <p class="text-xs text-slate-500">Ponto Eletrônico da Residência Veterinária</p>
        </div>
      </div>
      <div id="userHeaderInfo" class="hidden flex items-center space-x-3">
        <div class="text-right">
          <span id="userName" class="block font-medium text-sm text-slate-800"></span>
          <span id="userRole" class="block text-xs text-blue-600 font-semibold uppercase"></span>
        </div>
        <button onclick="logout()" class="p-2 text-slate-400 hover:text-red-600 hover:bg-slate-100 rounded-lg transition" title="Sair">
          <i class="fa-solid fa-right-from-bracket text-lg"></i>
        </button>
      </div>
    </div>
  </header>

  <!-- CONTEÚDO PRINCIPAL -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-grow w-full">

    <!-- TELA DE LOGIN -->
    <section id="loginScreen" class="max-w-md mx-auto bg-white p-8 rounded-2xl shadow-sm border border-slate-200 mt-6">
      <div class="text-center mb-6">
        <h2 class="text-2xl font-bold text-slate-900">Acesso ao Sistema</h2>
        <p class="text-sm text-slate-500 mt-1">Identifique-se para gerenciar o ponto</p>
      </div>

      <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">E-mail corporativo / institucional</label>
          <div class="relative">
            <i class="fa-solid fa-envelope absolute left-3 top-3.5 text-slate-400 text-sm"></i>
            <input type="email" id="loginEmail" required class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white" placeholder="exemplo@ufmt.br">
          </div>
        </div>

        <div>
          <label class="block text-sm font-medium text-slate-700 mb-1">Senha</label>
          <div class="relative">
            <i class="fa-solid fa-lock absolute left-3 top-3.5 text-slate-400 text-sm"></i>
            <input type="password" id="loginPassword" required class="w-full pl-10 pr-3 py-2.5 bg-slate-50 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:bg-white" placeholder="••••••••">
          </div>
        </div>

        <div id="loginError" class="hidden text-xs text-red-600 bg-red-50 p-2.5 rounded-lg border border-red-200">
          E-mail ou senha incorretos. Tente novamente.
        </div>

        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-sm">
          Entrar
        </button>

        <div class="bg-blue-50/70 p-3 rounded-lg border border-blue-100 text-xs text-slate-600 space-y-1 mt-4">
          <p class="font-semibold text-blue-900 mb-1"><i class="fa-solid fa-circle-info me-1"></i> Contas de Simulação:</p>
          <p>• <strong>Residente:</strong> residente@ufmt.br (Senha: 123456)</p>
          <p>• <strong>Coordenador:</strong> coord@ufmt.br (Senha: 123456)</p>
        </div>
      </form>
    </section>

    <!-- PAINEL DO RESIDENTE -->
    <section id="residentDashboard" class="hidden space-y-6">
      
      <!-- CARD DE REGISTRO RÁPIDO E CRONÔMETRO -->
      <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-200 grid grid-cols-
